# 로컬 멀티에이전트 PR 리뷰
#
# 보안 주의 (반드시 읽을 것):
#   - 트리거는 `pull_request`다. `pull_request_target`으로 바꾸지 마라.
#     `pull_request_target`은 PR의 코드를 base 저장소의 시크릿과 함께 실행하므로,
#     self-hosted 러너에서는 임의 코드 실행으로 이어진다.
#   - 아래 `if` 가드는 fork PR을 제외한다. fork PR도 리뷰하려면 별도의 격리된
#     러너를 쓰고, `.review-swarm.yaml`의 `checks:`를 반드시 비워라
#     (checks는 PR이 가져온 코드를 실행한다).
#   - 리뷰 에이전트 자체는 읽기 전용 샌드박스에서 동작한다.

name: review-swarm

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-swarm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 같은 저장소에서 올라온 PR만 리뷰한다. draft는 건너뛴다.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: [self-hosted, review-swarm]
    timeout-minutes: 45

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          # 워크플로 토큰을 체크아웃에 남기지 않는다. 리뷰는 로컬 git 읽기(diff /
          # merge-base)만 하고 GitHub 호출은 자체 토큰·App 자격으로 하므로 필요 없다.
          # fetch-depth: 0으로 전체 히스토리를 받아두면 추가 fetch도 일어나지 않는다.
          persist-credentials: false
          # 에이전트가 관련 코드를 직접 읽어야 하므로 전체 히스토리를 받는다.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Review
        # ← 이 도구를 담은 저장소로 바꾸고, 반드시 40자리 커밋 SHA로 고정하라.
        # 이 액션은 pull-requests:write 권한으로 self-hosted 러너에서 실행되므로,
        # @main 같은 mutable 참조를 쓰면 그 브랜치에 들어간 코드가 다음 PR에서
        # 그대로 러너에서 실행된다.
        uses: ORG/REPO/review-swarm@0000000000000000000000000000000000000000
        with:
          fail-on: never
          upload-artifacts: 'true'
        env:
          # 연결된 이슈의 목표·인수 조건·범위 밖 항목을 리뷰 컨텍스트로 넣는다.
          # 없으면 경고만 남기고 PR 본문만으로 진행한다.
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        # 기본값(publish.mode: single)에서는 시크릿이 전혀 필요 없다. 모든 코멘트가
        # github-actions[bot]으로 게시되고, 어느 페르소나의 지적인지는 코멘트
        # 머리말에 표시된다. 이 상태로 먼저 며칠 써보길 권한다.
        #
        # 에이전트마다 별도 봇 계정으로 보이게 하려면 GitHub App을 만들어 아래를 켜고
        # `.review-swarm.yaml`의 publish.mode를 apps로 바꾼다. 만든 것만 넣으면 되고,
        # 나머지 에이전트는 계속 공용 토큰으로 게시된다. 절차는 README 참고.
        #
        # env:
        #   SWARM_SECURITY_APP_ID: ${{ secrets.SWARM_SECURITY_APP_ID }}
        #   SWARM_SECURITY_PRIVATE_KEY: ${{ secrets.SWARM_SECURITY_PRIVATE_KEY }}
        #   SWARM_CONSISTENCY_APP_ID: ${{ secrets.SWARM_CONSISTENCY_APP_ID }}
        #   SWARM_CONSISTENCY_PRIVATE_KEY: ${{ secrets.SWARM_CONSISTENCY_PRIVATE_KEY }}
        #   SWARM_PERFORMANCE_APP_ID: ${{ secrets.SWARM_PERFORMANCE_APP_ID }}
        #   SWARM_PERFORMANCE_PRIVATE_KEY: ${{ secrets.SWARM_PERFORMANCE_PRIVATE_KEY }}
        #   SWARM_ARCHITECT_APP_ID: ${{ secrets.SWARM_ARCHITECT_APP_ID }}
        #   SWARM_ARCHITECT_PRIVATE_KEY: ${{ secrets.SWARM_ARCHITECT_PRIVATE_KEY }}
        #   SWARM_PRAGMATIST_APP_ID: ${{ secrets.SWARM_PRAGMATIST_APP_ID }}
        #   SWARM_PRAGMATIST_PRIVATE_KEY: ${{ secrets.SWARM_PRAGMATIST_PRIVATE_KEY }}
        #   SWARM_COLLABORATOR_APP_ID: ${{ secrets.SWARM_COLLABORATOR_APP_ID }}
        #   SWARM_COLLABORATOR_PRIVATE_KEY: ${{ secrets.SWARM_COLLABORATOR_PRIVATE_KEY }}
        #   SWARM_MEDIATOR_APP_ID: ${{ secrets.SWARM_MEDIATOR_APP_ID }}
        #   SWARM_MEDIATOR_PRIVATE_KEY: ${{ secrets.SWARM_MEDIATOR_PRIVATE_KEY }}
