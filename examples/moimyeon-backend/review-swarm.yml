# 100Thieves-team/moimyeon-backend 전용 워크플로
# 대상 저장소의 .github/workflows/review-swarm.yml 로 둔다.
#
# 보안 (public 저장소 + self-hosted 러너 조합이라 특히 중요):
#   - 트리거는 `pull_request`다. 절대 `pull_request_target`으로 바꾸지 마라.
#   - 아래 `if` 가드가 fork PR을 제외한다. public 저장소는 누구나 fork 후 PR을 열 수 있고,
#     self-hosted 러너에서 fork PR을 돌리면 남의 코드를 우리 맥에서 실행하는 것이 된다.
#     이 가드를 지우지 마라.
#   - 추가로 저장소 Settings → Actions → General → Fork pull request workflows 에서
#     "Require approval for all external contributors"를 켜 둘 것.

name: review-swarm

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-swarm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 리뷰를 돌릴 PR 작성자. 러너가 개인 맥이고 모델 호출도 개인 구독이라
    # 우선 본인 PR만 대상으로 한다. 팀에 열 때 배열에 로그인 아이디를 추가하면 된다.
    #   예: '["bebeis", "dbwp031", "2wndrhs"]'
    if: >-
      contains(fromJSON('["bebeis"]'), github.event.pull_request.user.login) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: [self-hosted, review-swarm]
    timeout-minutes: 45

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          # 워크플로 토큰을 체크아웃에 남기지 않는다. 리뷰는 로컬 git 읽기(diff /
          # merge-base)만 하고 GitHub 호출은 자체 토큰·App 자격으로 하므로 필요 없다.
          persist-credentials: false
          # 에이전트가 호출부·구현체·테스트를 직접 열어봐야 하므로 전체 히스토리가 필요하다.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # 러너 서비스의 PATH에 node가 없을 수 있어 명시적으로 깐다.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Review
        # 커밋 SHA로 고정한다. 이 액션은 pull-requests:write 권한으로 self-hosted
        # 러너에서 실행되므로, @main 같은 mutable 참조를 쓰면 그 브랜치에 들어간 코드가
        # 다음 PR에서 그대로 돌게 된다.
        # 업데이트할 때는 review-swarm의 새 커밋을 확인한 뒤 이 SHA를 올린다.
        uses: 100Thieves-team/review-swarm@6d586007e5a018c4eedef98b071e3ce24d1f94b5
        with:
          fail-on: never
          upload-artifacts: 'true'
        # 시크릿을 전달하지 않는다. `.review-swarm.yaml`이 publish.mode: single이라
        # 모든 코멘트는 워크플로 기본 토큰(github-actions[bot])으로 게시되고,
        # 어느 페르소나가 낸 지적인지는 코멘트 머리말에 표시된다.
        #
        # 에이전트마다 별도 봇 계정으로 보이게 하려면 GitHub App 7개를 만들고
        # SWARM_<AGENT>_APP_ID / _PRIVATE_KEY 를 env로 넘긴 뒤 mode를 apps로 바꾼다.
        # 절차는 review-swarm 저장소 README의 "에이전트별 GitHub App을 만든다" 참고.
