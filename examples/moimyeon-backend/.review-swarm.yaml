# 100Thieves-team/moimyeon-backend 전용 설정
# 대상 저장소 루트에 `.review-swarm.yaml`로 둔다.
#
# 저장소 특성에 맞춘 부분:
#   - Kotlin + Gradle 멀티모듈 (core/, admin/, clients/, security/, storage/, support/, tests/, infra/)
#   - Spring Boot + JPA + Flyway (storage/db-core/src/main/resources/db/migration)
#   - CLAUDE.md / AGENTS.md는 teamRuleFiles 기본값에 이미 포함되어 자동 수집된다

version: 1

engine:
  default: claude
  # router.maxAgents와 같게 둔다. 이보다 작으면 전문가들이 슬롯 대기로 직렬화된다.
  concurrency: 5
  timeoutMs: 900000
  retries: 1
  claude:
    model: sonnet
    tools: [Read, Grep, Glob]

# effort가 리뷰 속도를 가장 크게 좌우한다. low | medium | high | xhigh | max.
# low는 놓치는 게 많고 xhigh는 한 턴에 수 분이 걸린다. medium이 실사용 균형점이다.
# 특정 에이전트만 더 깊게 보고 싶으면 그 항목만 high로 올린다.
# extraInstructions는 문서를 인라인하지 않고 **어디를 읽을지** 알려준다.
# docs/conventions 12개 문서는 합쳐서 109KB라 전부 넣으면 프롬프트가 4배가 되고
# 대부분은 해당 PR과 무관하다. 에이전트는 Read/Glob이 있으므로 필요할 때만 연다.
agents:
  security:
    enabled: true
    effort: medium
    knowledgeFiles: [docs/knowledge/security.md]
    extraInstructions: |
      인증·인가 관련 변경을 판단하기 전에 `docs/conventions/auth.md`를 반드시 읽어라.
      이 서비스의 로그인은 Google OAuth이고 세션 인증 규칙과 인가 정책이 그 문서에 확정되어 있다.
      컨트롤러가 인증 주체를 받는 방식도 정해져 있으므로, 개별 컨트롤러의 수동 검사는
      규칙 위반일 수 있다 — 프레임워크가 이미 막는 문제를 보고하지 않도록 먼저 확인하라.
      인증 기술은 `security-core` 모듈에 격벽으로 분리되어 있다(`docs/conventions/modules.md`).
      core가 인증 기술에 직접 의존하면 그 자체가 지적 대상이다.

  consistency:
    enabled: true
    effort: medium
    extraInstructions: |
      트랜잭션 경계를 판단하기 전에 `docs/conventions/layers.md`의 "트랜잭션" 절을 읽어라.
      이 저장소는 Controller / Facade / Service / Implement 4계층이고 어느 레이어가
      트랜잭션을 여는지가 문서로 확정되어 있다. 그 규칙과 다른 위치에 @Transactional이
      붙었는지를 기준으로 판단하라.
      동시성 레이스는 `docs/conventions/errors.md`의 "유니크 충돌(동시성 레이스) 매핑 규칙"에
      처리 방침이 정해져 있다. 그 방침으로 이미 커버되는 경우를 새 문제로 보고하지 마라.
      스키마 변경은 `docs/conventions/storage.md`의 Flyway 절을 따른다.

  performance:
    enabled: true
    effort: medium
    knowledgeFiles: [docs/knowledge/performance.md]
    extraInstructions: |
      JPA 사용 규칙은 `docs/conventions/storage.md`의 "JPA 매핑 규칙"과 "Repository" 절에
      확정되어 있다. N+1이나 인덱스 문제를 제기하기 전에 그 규칙이 이미 방지하고 있는지 확인하라.
      스키마의 단일 소스는 `schema.sql`이다. 인덱스 유무를 주장하려면 추측하지 말고 그 파일을 열어 확인하라.

  architect:
    enabled: true
    effort: medium
    extraInstructions: |
      이 저장소의 구조는 이미 문서로 확정되어 있다. 추상화를 제안하기 전에 반드시 확인하라.
      - `docs/conventions/layers.md`: Controller / Facade / Service / Implement 4계층.
        문서 앞부분의 "반드시 지킬 것은 두 가지다" 절이 핵심 계약이다.
      - `docs/conventions/concepts.md`: "개념 간 지식 방향"과 "격벽을 지키는 규칙".
      - `docs/conventions/modules.md`: 모듈 간 의존 규칙.
      문서가 이미 정해 둔 구조를 "새 추상화"로 제안하지 마라. 반대로 이 규칙을 벗어난
      의존·호출 방향은 취향 문제가 아니라 명백한 위반이므로 근거를 문서 절 이름으로 제시하라.

  pragmatist:
    enabled: true
    effort: medium
    extraInstructions: |
      주의: 이 저장소는 레이어·격벽 규칙이 `docs/conventions/`에 문서로 확정되어 있다.
      문서가 요구해서 생긴 구조(Facade, Implement, 포트/어댑터 격벽 등)를 과설계로 오판하지 마라.
      과설계 지적은 문서에 근거가 없는 새 추상화에만 해당한다.
      판단이 서지 않으면 `docs/conventions/README.md`의 "1. 한 장 요약"을 먼저 확인하라.

  collaborator:
    enabled: true
    effort: medium
    extraInstructions: |
      이 저장소는 Kotlin + Spring Boot + Gradle 멀티모듈이다.
      모듈 경계(core / admin / clients / security / storage / support)를 넘는 의존이 새로 생기면 반드시 지적하라.
      DB 스키마 변경은 Flyway 마이그레이션(storage/db-core/src/main/resources/db/migration)으로만 이루어져야 하며,
      마이그레이션 버전 번호는 CI가 중복을 검사한다는 사실을 전제로 판단하라.
      계약·컨벤션을 주장할 때는 다음 문서를 근거로 인용하라. 없는 규칙을 만들어내지 마라.
      - API 계약(URI, DTO, 검증 위치, 응답 포맷): `docs/conventions/api-design.md`
      - 테스트 분류와 레이어별 전략: `docs/conventions/testing.md`
      - 커밋·PR 컨벤션: `docs/conventions/git.md`
      - API 문서화: `docs/conventions/api-docs.md`

  mediator:
    enabled: true
    effort: medium
    extraInstructions: |
      이 저장소는 `docs/conventions/` 아래에 확정된 규칙 문서를 가지고 있다.
      에이전트가 문서의 특정 절을 근거로 든 지적은 "취향"으로 기각하지 마라.
      반대로 문서에 근거가 없는 구조 제안은 근거 부족으로 판단하라.

router:
  always: [security, pragmatist]
  maxAgents: 5 # PR당 비용 상한. 늘리면 리뷰는 촘촘해지고 시간·토큰이 는다
  fullSweepChangedLines: 400
  rules:
    - name: persistence
      paths:
        - 'storage/**'
        - '**/db/migration/**'
        - '**/*.sql'
        - '**/*Repository.kt'
        - '**/*RepositoryImpl.kt'
        - '**/entity/**'
        - '**/*Entity.kt'
      content: ['@Query', '@Modifying', 'createQuery', 'findAll', 'JPAQuery', 'querydsl', 'fetchJoin']
      add: [performance, consistency]

    - name: auth
      paths:
        - 'security/**'
        - '**/*Filter.kt'
        - '**/*Authentication*.kt'
        - '**/*Authorization*.kt'
        - '**/*Jwt*.kt'
        - '**/*Oauth*.kt'
        - '**/*OAuth*.kt'
        - '**/config/Security*.kt'
      content: [jwt, oauth, password, secret, token, authorize, hasRole, principal, '@PreAuthorize']
      add: [security, collaborator]

    - name: domain
      paths:
        - 'core/core-api/**'
        - 'core/core-batch/**'
        - '**/*Service.kt'
        - '**/*UseCase.kt'
        - '**/domain/**'
      content: []
      add: [consistency, architect]

    - name: transaction-and-concurrency
      paths: []
      content:
        - '@Transactional'
        - '@Async'
        - '@Scheduled'
        - '@Retryable'
        - 'runBlocking'
        - 'CompletableFuture'
        - 'redisTemplate'
        - 'RedissonClient'
        - 'lockAtLeastFor'
      add: [consistency]

    - name: external-io
      paths:
        - 'clients/**'
        - '**/*Client.kt'
        - '**/*Adapter.kt'
      content: [RestTemplate, WebClient, RestClient, FeignClient, HttpClient, 'okhttp']
      add: [consistency, performance]

    - name: api-contract
      paths:
        - '**/*Controller.kt'
        - '**/dto/**'
        - '**/*Request.kt'
        - '**/*Response.kt'
        - 'docs/**'
      content: []
      add: [collaborator, security]

    - name: ops-surface
      paths:
        - 'infra/**'
        - '**/*.tf'
        - 'Dockerfile'
        - 'docker-compose.yml'
        - '.github/workflows/**'
        - '**/application*.yml'
        - '**/application*.yaml'
        - '.env.example'
      content: []
      add: [collaborator, security]

    - name: structure
      paths: ['**/*.kt', '**/*.kts']
      content: []
      add: [architect]

verify:
  enabled: true
  minSeverity: medium
  voters: 1 # 신뢰가 쌓이기 전까지는 1. 오탐이 거슬리면 3으로 올린다
  refuteThreshold: 0.5
  effort: medium

debate:
  enabled: true
  maxPairs: 2
  effort: medium

mediator:
  enabled: true
  effort: medium

policy:
  gateAgents: [security, consistency]
  analystAgents: [performance]
  valueAgents: [architect, pragmatist, collaborator]
  blockMinSeverity: high
  blockMinConfidence: 0.7
  requireAnalystEvidence: true
  maxInlinePerAgent: 5
  maxInlineTotal: 20
  maxSnapDistance: 20
  # low 지적도 버리지 않는다. 다만 인라인으로 diff에 줄줄이 달리면 정작 막아야 할
  # 지적과 주목을 다툰다. medium 미만은 요약 섹션에 모아서 보여준다.
  # (반복 자체는 별도 장치로 막는다 — 스레드 resolve/👎, 이전 리뷰 컨텍스트, 지문 중복 억제)
  inlineMinSeverity: medium
  # 실제로 버리는 것은 info뿐. 페르소나 지침이 확신도 0.5 미만은 내지 말라고 하므로
  # 그 선에 맞춘다.
  dropBelowSeverity: info
  dropBelowConfidence: 0.5

publish:
  # 처음에는 single로 시작해서 리뷰 품질을 확인하고,
  # GitHub App 7개를 다 만든 뒤 apps로 바꾼다.
  mode: single
  # 처음에는 comment로 두고 머지를 막지 않는다. 신뢰가 쌓이면 auto로 바꾼다.
  event: comment
  approveWhenClean: false
  minimizeStale: false
  language: ko
  summaryAgent: mediator
  skipDuplicates: true

context:
  diffContextLines: 5
  maxDiffChars: 600000
  maxPromptDiffChars: 160000
  # CLAUDE.md는 AGENTS.md 심링크라 하나만 넣는다(둘 다 넣으면 같은 내용이 두 번 실린다).
  # 컨벤션 상세 12개 문서는 합쳐 109KB라 인라인하지 않는다. README.md가 허브로 요약과
  # 링크를 모두 갖고 있고, 에이전트는 Read/Glob으로 하위 문서를 직접 열 수 있다.
  teamRuleFiles:
    - AGENTS.md
    - docs/conventions/README.md
    - docs/conventions/modules.md
    - docs/knowledge/README.md
  maxTeamRuleChars: 20000

# 비워 둔다. ci.yml이 이미 GitHub 호스티드 러너에서 ktlintCheck와 test를 돌린다.
# 여기에 ./gradlew test를 넣으면 (1) 같은 일을 두 번 하고 (2) PR이 가져온 코드를
# 로컬 러너에서 실행하게 된다.
checks: []

ignore:
  - '**/*.lock'
  - '**/build/**'
  - '**/.gradle/**'
  - 'gradle/**'
  - 'gradlew'
  - 'gradlew.bat'
  - '**/generated/**'
  - '**/*.min.js'
  - '**/*.svg'
  - '**/*.png'
  - '**/*.jpg'
  - '**/*.pdf'
